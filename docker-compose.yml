# Dev-only credentials — never use in production.
services:
  db:
    image: postgres:16
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice_dashboard
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
